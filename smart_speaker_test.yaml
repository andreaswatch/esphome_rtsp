substitutions:
  name: p4-smart-speaker
  friendly_name: "Waveshare ESP32-P4 Eth"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.11.0
  includes:
    - audio_recorder.h
  on_boot:
    - priority: -200
      then:
        - switch.turn_on: speaker_enable
        - delay: 200ms
        - audio_dac.set_volume:
            id: es8311_dac
            volume: 85%

esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  flash_size: 16MB
  cpu_frequency: 360MHZ
  framework:
    type: esp-idf
    components:
      - name: espressif/esp_audio_codec
        ref: "2.5.0"
    advanced:
      enable_idf_experimental_features: yes

esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  slot: 1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80
  version: 3

psram:
  mode: hex
  speed: 200MHZ

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

api:

ota:
  - platform: esphome

i2c:
  sda: GPIO7
  scl: GPIO8
  frequency: 400kHz
  scan: True

# 1. ES8311 Codec (use_microphone: True)
audio_dac:
  - platform: es8311
    id: es8311_dac
    bits_per_sample: 16bit
    address: 0x18
    sample_rate: 16000
    use_mclk: True
    use_microphone: false
    mic_gain: 42DB

# 2. I2S Audio Bus
i2s_audio:
  - id: i2s_output
    i2s_mclk_pin: GPIO13
    i2s_bclk_pin: GPIO12
    i2s_lrclk_pin: GPIO10

# 3. Mikrofon
microphone:
  - platform: i2s_audio
    id: i2s_microphone
    i2s_audio_id: i2s_output
    adc_type: external
    i2s_din_pin: GPIO11
    bits_per_sample: 16bit
    channel: left
    on_data:
      - lambda: |-
          if (get_is_recording()) {
            auto &recorded_audio = get_recorded_audio();
            recorded_audio.insert(recorded_audio.end(), x.begin(), x.end());
            // Limit to 3 seconds max (3 * 16000 = 48000 samples)
            if (recorded_audio.size() > 48000) {
              recorded_audio.resize(48000);
              get_is_recording() = false;
              ESP_LOGI("audio_recorder", "Recording buffer full (3 seconds). Stopped recording.");
            }
          }

# 4. Sound Level Sensor (passive: false)
sensor:
  - platform: sound_level
    id: sound_level_id
    passive: false
    microphone:
      microphone: i2s_microphone
      channels: 1
    peak:
      name: "Peak Loudness"
    rms:
      name: "Average Loudness"

# 5. Lautsprecher
speaker:
  - platform: i2s_audio
    id: i2s_speaker
    dac_type: external
    channel: mono
    i2s_audio_id: i2s_output
    audio_dac: es8311_dac
    i2s_dout_pin: GPIO9
    num_channels: 1
    buffer_duration: 300ms
    sample_rate: 16000
    bits_per_sample: 16bit

# 6. Speaker Enable Switch (GPIO53)
switch:
  - platform: gpio
    name: "Speaker Enable"
    id: speaker_enable
    pin: GPIO53
    restore_mode: ALWAYS_ON

  - platform: template
    name: "use_microphone (PDM Mode)"
    id: use_microphone_pdm
    optimistic: true
    assumed_state: true
    turn_on_action:
      - lambda: |-
          id(es8311_dac).write_byte(0x14, 0x5A);
          ESP_LOGI("es8311", "use_microphone set to true: PDM mode enabled (Reg 0x14 = 0x5A)");
    turn_off_action:
      - lambda: |-
          id(es8311_dac).write_byte(0x14, 0x1A);
          ESP_LOGI("es8311", "use_microphone set to false: Analog mode enabled (Reg 0x14 = 0x1A)");

# 7. Button für 1kHz Test-Ton
button:
  - platform: template
    name: "Play 1kHz Test Tone"
    on_press:
      - lambda: |-
          static int16_t tone_buf[16000];
          for (int i = 0; i < 16000; i++) {
            tone_buf[i] = (int16_t)(16000.0f * sinf(2.0f * M_PI * 1000.0f * i / 16000.0f));
          }
          id(i2s_speaker).play((const uint8_t*)tone_buf, sizeof(tone_buf));

  - platform: template
    name: "Record and Playback Audio"
    id: record_and_playback_audio
    on_press:
      - lambda: |-
          ESP_LOGI("audio_recorder", "Starting 2-second audio recording...");
          get_recorded_audio().clear();
          get_is_recording() = true;
          // Ensure speaker is stopped to release the I2S bus before recording
          id(i2s_speaker).stop();
          id(i2s_microphone).start();
      - delay: 2s
      - lambda: |-
          get_is_recording() = false;
          id(i2s_microphone).stop();
          ESP_LOGI("audio_recorder", "Recording stopped. Recorded %d samples.", get_recorded_audio().size());
      - delay: 100ms # Wait for microphone to fully release the I2S bus
      - lambda: |-
          auto &audio = get_recorded_audio();
          if (audio.empty()) {
            ESP_LOGW("audio_recorder", "Nothing recorded!");
            return;
          }
          ESP_LOGI("audio_recorder", "Playing back recorded audio...");
          // Ensure speaker DAC is unmuted and volume is set
          id(es8311_dac).set_mute_off();
          id(es8311_dac).set_volume(1.0f);
          id(i2s_speaker).start();
          id(i2s_speaker).play(reinterpret_cast<const uint8_t*>(audio.data()), audio.size() * sizeof(int16_t));

# 8. Media Player & Voice Assistant
media_player:
  - platform: speaker
    name: "Smart Speaker Audio Output"
    id: ha_media_player
    announcement_pipeline:
      speaker: i2s_speaker

voice_assistant:
  id: va
  microphone: i2s_microphone
  speaker: i2s_speaker
