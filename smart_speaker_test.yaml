substitutions:
  name: p4-smart-speaker
  friendly_name: "Waveshare P4 Smart Speaker"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.11.0

esp32:
  variant: esp32p4
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    components:
      - name: espressif/esp_audio_codec
        ref: "2.5.0"
    advanced:
      enable_idf_experimental_features: true

esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  slot: 1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

psram:
  mode: hex
  speed: 200MHz

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:

ota:
  - platform: esphome

# 1. I2C Bus für den ES8311 Audio Codec (Waveshare P4 Pinout: SDA=GPIO7, SCL=GPIO8)
i2c:
  - id: i2c_audio
    sda: GPIO7
    scl: GPIO8

# 2. ES8311 Audio Codec Initialisierung
audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_audio
    sample_rate: 16000
    bits_per_sample: 16bit
    use_microphone: false  # analoger Mikrofoneingang (DSDIN/MIC1)
    mic_gain: 30DB         # 30dB für deutliche Sprachaufnahme

# 3. Gemeinsamer I2S Bus für Mikrofon & Lautsprecher
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

# 4. Mikrofoneingang (ASDOUT = GPIO11)
microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO11
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left

# 5. Lautsprecherausgang (DSDIN = GPIO9)
speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO9
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono

# 6. NS4150B Audio-Verstärker Freigabe (GPIO47)
switch:
  - platform: gpio
    name: "Verstärker NS4150B"
    pin: GPIO47
    restore_mode: RESTORE_DEFAULT_ON
    id: amp_switch

# 7. Media Player für Musik & Ansagen aus Home Assistant
media_player:
  - platform: speaker
    name: "Smart Speaker Audio Output"
    id: ha_media_player
    announcement_pipeline:
      speaker: spk

# 8. Home Assistant Voice Assistant Pipeline (Sprachsteuerung / Assist)
voice_assistant:
  id: va
  microphone: mic
  speaker: spk
