substitutions:
  name: p4-rtsp-cam
  friendly_name: P4 RTSP Camera

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.11.0

esp32:
  variant: esp32p4
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    components:
      - name: espressif/esp_video
        ref: "^0.8.0"
      - name: espressif/esp_h264
        ref: "^1.3.0"
    advanced:
      enable_idf_experimental_features: true

esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  slot: 1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

psram:
  mode: hex
  speed: 200MHz

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG
  logs:
    ISP: NONE

api:

web_server:
  port: 80

ota:
  - platform: esphome

i2c:
  - id: i2c_audio
    sda: GPIO7
    scl: GPIO8

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_audio
    sample_rate: 16000
    bits_per_sample: 16bit
    # IMPORTANT: use_microphone must stay false. When true, the ES8311
    # component sets REG14 BIT(6) which switches the codec into PDM digital
    # microphone mode. Our mic is the ANALOG DSDIN input (GPIO9), so PDM mode
    # produces all-zero samples. The analog mic path is enabled by default
    # (REG14 = 0x1A) even with use_microphone: false.
    use_microphone: false
    mic_gain: 42DB

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO11  # ASDOUT from ES8311 - Microphone data input
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left
    # AGC (Automatic Gain Control) für bessere Audio-Qualität
    # use_agc: true  # Falls verfügbar

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO9  # DSDIN to ES8311 - Speaker data output
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono

switch:
  - platform: gpio
    name: Speaker Enable
    pin: GPIO53
    restore_mode: RESTORE_DEFAULT_ON

external_components:
  - source: components
    components: [p4_rtsp, esp_ipa]
    refresh: 0s

p4_rtsp:
  port: 554
  video:
    resolution: 800x800
    fps: 25
    bitrate: 2000000
    gop: 25
    always_on: true
    sccb_sda: 7
    sccb_scl: 8
    xclk_pin: 40
    data_lanes: 2
    power_down_pin: 27
  audio:
    microphone: mic
    speaker: spk
    sample_rate: 16000
    channels: 1
    test_tone:
      name: "Audio Test-Ton"
      icon: "mdi:volume-high"
