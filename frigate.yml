# Frigate Konfiguration für ESP32-P4 RTSP Camera.
# Speichern als frigate.yml oder in die Frigate-Config einfügen.
# Audio-Stream vom ESP ist L16 (s16be); Rückkanal an den ESP ist PCMA.

# go2rtc Integration
go2rtc:
  streams:
    esp32p4_cam:
      # Video + L16-Audio nativ via go2rtc, mit Rückkanal
      - rtsp://192.168.178.196:554/live?backchannel=1#video=h264#audio=all#tcp

cameras:
  esp32p4_cam:
    enabled: true

    ffmpeg:
      inputs:
        # Hauptstream über go2rtc (empfohlen für Two-Way Audio)
        - path: rtsp://127.0.0.1:8554/esp32p4_cam
          roles:
            - record
            - detect
            - audio

    # Audio Konfiguration für Two-Way Audio
    audio:
      enabled: true
      # Mikrofon-Eingabe vom ESP (L16-Stream über go2rtc)
      listen:
        - esp32p4_cam
      # Rückkanal zum ESP (Speaker) -> G.711 A-law
      output:
        - path: rtsp://192.168.178.196:554/live?backchannel=1
          codec: pcma

    detect:
      enabled: false

    record:
      enabled: true
      retain:
        days: 7
      events:
        pre_capture: 3
        post_capture: 3
