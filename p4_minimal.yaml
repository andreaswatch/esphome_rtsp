# =============================================================================
# Minimaler OTA-Stub (Zwischenschritt)
#
# Nur das Nötigste für einen OTA-Flash: WiFi (ESP32-C6 hosted), API, Web-Server
# mit /update-Endpoint und beide OTA-Plattformen. KEIN RTSP, KEINE Kamera,
# KEIN Audio. Ziel: möglichst kleines Image, das sich auch mit der aktuell
# defekten OTA-Situation auf dem Gerät flashen lässt. Danach reguläres Image
# (p4_stream.yaml) per OTA aufspielen.
# =============================================================================

substitutions:
  name: p4-ota-stub
  friendly_name: P4 OTA Stub

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.6.5

esp32:
  variant: esp32p4
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  use_psram: true
  slot: 1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

psram:
  mode: hex
  speed: 200MHz

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:

web_server:
  port: 80
  version: 3

ota:
  - platform: esphome
  - platform: web_server

switch:
  - platform: restart
    name: "Reboot"
