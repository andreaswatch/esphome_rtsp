substitutions:
  name: p4-rtsp-cam
  friendly_name: P4 RTSP Camera

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.1.0

esp32:
  variant: esp32p4
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    components:
      - espressif/esp_video^0.8.0
      - espressif/esp_h264^1.3.0
    advanced:
      enable_idf_experimental_features: true

esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  use_psram: true
  slot: 1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

psram:
  mode: hex
  speed: 200MHz

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:

ota:
  - platform: esphome

i2c:
  - id: i2c_audio
    sda: GPIO7
    scl: GPIO8

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_audio
    sample_rate: 16000
    bits_per_sample: 16bit

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO9
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: right

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO11
    dac_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono

switch:
  - platform: gpio
    name: Speaker Enable
    pin: GPIO53
    restore_mode: RESTORE_DEFAULT_ON

external_components:
  - source: github://andreaswatch/esphome_rtsp@v0.1.1
    components: [p4_rtsp]
    refresh: 0s

p4_rtsp:
  port: 554
  web_port: 8080
  video:
    resolution: 1280x720
    fps: 25
    bitrate: 4000000
    gop: 25
    sccb_sda: 7
    sccb_scl: 8
    xclk_pin: 40
    data_lanes: 2
  audio:
    microphone: mic
    speaker: spk
    sample_rate: 16000
    channels: 1
